[project]
name = "objectdesign"
version = "0.1.0"
description = "Agent-driven, parametric build123d designs for 3D printing"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "build123d>=0.13",
    "bd_warehouse>=0.4",
    "ocp-vscode>=4.3",
    "manifold3d>=3.5",
    "trimesh>=5.2",
    "numpy",
    "pillow",
    "networkx>=3.7",
    "lxml>=6.1.3",
]

[project.scripts]
od = "od.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "od"
